# Render Blueprint — Nexus API backend.
#
# Two supported paths:
#
# 1) FREE plan (no persistent disk, no credit card):
#    - Data lives in Supabase (managed Postgres + Storage) - already migrated.
#    - Profile + Gmail app password are stored per-user in the Supabase
#      user_settings table from cmd/set-settings (password AES-encrypted at
#      rest; the in-DB key is wrapped by NEXUS_SETTINGS_MASTER_KEY). Only the
#      3 connect secrets live in env: DB URL, service key, master key.
#    - Remaining NEXUS_* env vars below are optional overrides (set sync: false
#      in the Render dashboard, fill manually). No config file needed.
#    - NEXUS_HOME is ephemeral (/tmp) - fine because application state is in
#      Supabase; only local scratch resets on restart.
#    - Render free spins the service down after ~15 min idle. Pin
#      https://<service>.onrender.com/health with a free uptime pinger
#      (UptimeRobot, cron-job.org - every 5 min, no card) so the schedulers
#      (inbox scan, daily dry-run) keep running. NOTE: this is a ToS gray
#      area for free plans - if it becomes an issue, switch to starter.
#
# 2) STARTER plan (~$7/mo, card): no sleeping, persistent disk, config file
#    can live on disk. Set plan: starter and add the disk block at the bottom.
services:
  - type: web
    name: nexus-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NEXUS_HOME
        value: /tmp/nexus
      - key: NEXUS_SUPABASE_URL
        sync: false
      - key: NEXUS_DATABASE_URL
        sync: false
        # IMPORTANT: URL-encode special characters in the password if any - e.g.
        # % -> %%25 and / -> %%2F. An un-encoded password breaks the URL parse
        # with a confusing "hostname resolving error / failed to parse as URL".
      - key: NEXUS_SUPABASE_SERVICE_KEY
        sync: false
      - key: NEXUS_SETTINGS_MASTER_KEY
        sync: false
      - key: NEXUS_GMAIL_APP_PASSWORD
        sync: false
      - key: NEXUS_EMAIL
        sync: false
      - key: NEXUS_FIRST_NAME
        sync: false
      - key: NEXUS_LAST_NAME
        sync: false
      - key: NEXUS_OUTREACH_CONSENT
        value: "false"
      - key: NEXUS_INBOX_SCAN_MINUTES
        value: "60"

# Note for the starter plan - enable a persistent disk and remove /tmp:
#    disk:
#      name: nexus-data
#      mountPath: /var/lib/nexus
#      sizeGB: 1
